// ============================================================
//  EIF509 · Esqueleto de referencia · build.gradle (Groovy)
//  Java 21 + Spring Boot 3 + Gradle
// ============================================================

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'cr.ac.una'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // Java 21: el compilador y runtime que exige el curso
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web: para exponer endpoints HTTP (nuestra capa de presentación)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Validación Bean Validation para DTOs de entrada
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // Actuator: nos regala /actuator/health para monitorear la app
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Persistencia relacional para PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Migraciones versionadas del esquema relacional
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // Persistencia documental para MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    // Driver de PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    // H2 para arranque local y pruebas sin depender del contenedor de BD
    runtimeOnly 'com.h2database:h2'
    // Pruebas: JUnit 5 viene incluido en este starter
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.testcontainers') {
            details.useVersion '1.21.3'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'api.version', '1.44'
    finalizedBy(tasks.named('jacocoTestReport'))
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.test
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['cr.ac.una.eif509.demo.business']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
