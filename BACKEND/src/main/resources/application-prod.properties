spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:ganado_auditoria}
spring.autoconfigure.exclude=
spring.flyway.enabled=true
sisganado.jwt.secret=${SISGANADO_JWT_SECRET}
sisganado.auth.admin-password=${SISGANADO_ADMIN_PASSWORD}
sisganado.auth.veterinarian-password=${SISGANADO_VETERINARIAN_PASSWORD}
sisganado.cors.allowed-origins=${SISGANADO_CORS_ALLOWED_ORIGINS}
server.forward-headers-strategy=framework
management.endpoint.health.show-details=never
