# Nombre de la aplicacion
spring.application.name=sistema-control-sanitario-ganado

# Sin un perfil explícito, usa la configuración local de desarrollo.
spring.profiles.default=dev

# Configuracion por defecto: arranque funcional sin Docker
# JPA con H2 en memoria para pruebas y arranque local
spring.datasource.url=jdbc:h2:mem:ganado_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Mongo queda deshabilitado en arranque local por defecto para evitar fallos si no hay contenedor
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Exponer el endpoint de health de Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Reemplace estas variables de desarrollo en cualquier despliegue real.
sisganado.jwt.secret=${SISGANADO_JWT_SECRET:SisGanadoDevJwtSigningKeyMustBe32Bytes!}
sisganado.jwt.expiration-seconds=3600
sisganado.cors.allowed-origins=${SISGANADO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
sisganado.auth.admin-password=${SISGANADO_ADMIN_PASSWORD:AdminLocal2026!}
sisganado.auth.veterinarian-password=${SISGANADO_VETERINARIAN_PASSWORD:VetLocal2026!}

spring.mvc.problemdetails.enabled=true
