// ============================================================
//  EIF509 · Esqueleto de referencia · build.gradle (Groovy)
//  Java 21 + Spring Boot 3 + Gradle
// ============================================================

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'cr.ac.una'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // Java 21: el compilador y runtime que exige el curso
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web: para exponer endpoints HTTP (nuestra capa de presentación)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator: nos regala /actuator/health para monitorear la app
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Pruebas: JUnit 5 viene incluido en este starter
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
