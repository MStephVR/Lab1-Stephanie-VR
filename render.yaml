services:
  - type: web
    name: sisganado-api
    runtime: docker
    plan: free
    rootDir: BACKEND
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: SISGANADO_JWT_SECRET
        generateValue: true
      - key: SISGANADO_ADMIN_PASSWORD
        sync: false
      - key: SISGANADO_VETERINARIAN_PASSWORD
        sync: false
      - key: SISGANADO_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: sisganado-spa
    runtime: static
    rootDir: spa
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
